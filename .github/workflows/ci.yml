name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: npm ci
      - run: npm run check
      - name: Compile runtime Python and validate executed notebooks
        run: |
          python -m compileall -q src scripts deployment tests
          python - <<'PY'
          import json
          from pathlib import Path

          notebooks = sorted(Path("notebooks").glob("*.ipynb"))
          if len(notebooks) != 9:
              raise SystemExit(f"Expected 9 analytical notebooks, found {len(notebooks)}")

          for notebook in notebooks:
              document = json.loads(notebook.read_text(encoding="utf-8"))
              code_cells = [cell for cell in document["cells"] if cell["cell_type"] == "code"]
              unexecuted = [cell for cell in code_cells if cell.get("execution_count") is None]
              errors = [
                  output
                  for cell in code_cells
                  for output in cell.get("outputs", [])
                  if output.get("output_type") == "error"
              ]
              if unexecuted or errors:
                  raise SystemExit(
                      f"{notebook}: {len(unexecuted)} unexecuted code cells, {len(errors)} errors"
                  )
          print(f"Validated {len(notebooks)} fully executed notebooks")
          PY
      - name: Validate all container targets
        run: |
          docker build --target api --tag purchase-pattern-api:ci .
          docker build --target web --tag purchase-pattern-web:ci .
          docker build --target portfolio --tag purchase-pattern-analysis:ci .
